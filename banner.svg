<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280">
      <stop offset="0%" stop-color="#240000"/>
      <stop offset="35%" stop-color="#7A1200"/>
      <stop offset="70%" stop-color="#D84A05"/>
      <stop offset="100%" stop-color="#FFD6A0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Paint texture -->
  <circle cx="180" cy="90" r="120" fill="#8E0000" opacity="0.35" filter="url(#blur)"/>
  <circle cx="920" cy="100" r="160" fill="#FF8A00" opacity="0.25" filter="url(#blur)"/>
  <circle cx="1080" cy="60" r="90" fill="#FFF0D0" opacity="0.2" filter="url(#blur)"/>

  <!-- Wave -->
  <path d="
    M0 220
    C100 180 200 260 300 220
    S500 180 600 220
    S800 260 900 220
    S1100 180 1200 220"
    stroke="#FFD9A3"
    stroke-width="3"
    fill="none">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 220 C100 180 200 260 300 220 S500 180 600 220 S800 260 900 220 S1100 180 1200 220;
      M0 220 C100 260 200 180 300 220 S500 260 600 220 S800 180 900 220 S1100 260 1200 220;
      M0 220 C100 180 200 260 300 220 S500 180 600 220 S800 260 900 220 S1100 180 1200 220"/>
  </path>

  <!-- Name -->
  <text
    x="600"
    y="130"
    text-anchor="middle"
    fill="#FFF4E8"
    font-size="46"
    font-family="Segoe UI, Arial, sans-serif"
    font-weight="700">
    JILE AHMADI
  </text>

  <text
    x="600"
    y="170"
    text-anchor="middle"
    fill="#FFE2BC"
    font-size="18"
    font-family="Segoe UI, Arial, sans-serif">
    Full-Stack Developer
  </text>

</svg>
