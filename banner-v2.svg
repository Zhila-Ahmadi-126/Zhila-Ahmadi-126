<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A1B00"/>
      <stop offset="40%" stop-color="#D94E12"/>
      <stop offset="75%" stop-color="#FFB25A"/>
      <stop offset="100%" stop-color="#FFE9C7"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity="0.35"/>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="100" fill="url(#bg)"/>

  <!-- LIGHT GLOWS -->
  <circle cx="200" cy="10" r="90" fill="#FFE2B5" opacity="0.4" filter="url(#blur)"/>
  <circle cx="950" cy="15" r="110" fill="#FFFFFF" opacity="0.18" filter="url(#blur)"/>
  <circle cx="600" cy="95" r="120" fill="#FFC16B" opacity="0.25" filter="url(#blur)"/>

  <!-- GLASS WAVE CARD (NOW LIGHTER / WHITE) -->
  <path filter="url(#shadow)"
        fill="rgba(255,255,255,0.18)"
        stroke="rgba(255,255,255,0.35)">

    <animate attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="

      M350 20
      Q400 10 450 20
      Q500 30 550 20
      Q600 10 650 20
      Q700 30 750 20
      Q800 10 850 20
      Q900 30 900 70
      Q850 80 800 70
      Q750 60 700 70
      Q650 80 600 70
      Q550 60 500 70
      Q450 80 400 70
      Q350 60 350 20 Z;

      M350 25
      Q400 35 450 25
      Q500 15 550 25
      Q600 35 650 25
      Q700 15 750 25
      Q800 35 850 25
      Q900 45 900 70
      Q850 60 800 70
      Q750 80 700 70
      Q650 60 600 70
      Q550 80 500 70
      Q450 60 400 70
      Q350 50 350 25 Z;

      M350 20
      Q400 10 450 20
      Q500 30 550 20
      Q600 10 650 20
      Q700 30 750 20
      Q800 10 850 20
      Q900 30 900 70
      Q850 80 800 70
      Q750 60 700 70
      Q650 80 600 70
      Q550 60 500 70
      Q450 80 400 70
      Q350 60 350 20 Z

      "/>

  </path>

  <!-- NAME (dark brown, readable) -->
  <text x="600" y="58"
        text-anchor="middle"
        font-size="30"
        font-weight="700"
        fill="#3B1F14"
        letter-spacing="0.6"
        font-family="Inter, Poppins, Segoe UI, Arial, sans-serif">

    Jile Ahmadi

  </text>

</svg>
