<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B2C00"/>
      <stop offset="30%" stop-color="#E85D04"/>
      <stop offset="65%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFF4DD"/>
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

  </defs>

  <!-- Background -->

  <rect width="1200" height="100" fill="url(#bg)"/>

  <!-- Luxury glow -->

  <circle cx="180" cy="10" r="90"
          fill="#FFE6B8"
          opacity="0.55"
          filter="url(#glow)"/>

  <circle cx="1000" cy="20" r="100"
          fill="#FFFFFF"
          opacity="0.25"
          filter="url(#glow)"/>

  <circle cx="720" cy="90" r="120"
          fill="#FFD18A"
          opacity="0.25"
          filter="url(#glow)"/>

  <!-- Glass Card -->

  <rect
      x="360"
      y="18"
      width="480"
      height="64"
      rx="18"
      fill="url(#glass)"
      stroke="rgba(255,255,255,0.4)"
      filter="url(#shadow)"/>

  <!-- Highlight -->

  <rect
      x="370"
      y="24"
      width="460"
      height="2"
      rx="1"
      fill="white"
      opacity="0.45"/>

  <!-- Animated Wave -->

  <path
      stroke="#FFF9F0"
      stroke-width="2.5"
      fill="none"
      opacity="0.9">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 82 C150 65 250 95 400 82 S650 65 800 82 S1050 95 1200 82;
      M0 82 C150 95 250 65 400 82 S650 95 800 82 S1050 65 1200 82;
      M0 82 C150 65 250 95 400 82 S650 65 800 82 S1050 95 1200 82
      "/>

  </path>

  <!-- Name -->

 <text x="600" y="58"
        text-anchor="middle"
        font-size="30"
        font-weight="700"
        fill="#3B1F14"
        letter-spacing="0.6"
        font-family="Inter, Poppins, Segoe UI, Arial, sans-serif">

    Jile Ahmadi

  </text>

</svg>
